<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <div class="header-wrapper container">
            <p class="page-logo">Header Logo</p>
            <ul class="header-links">
                <li class="header-link"><a href="#">header link one</a></li>
                <li class="header-link"><a href="#">header link two</a></li>
                <li class="header-link"><a href="#">header link three</a></li>
            </ul>
        </div>
    </header>

    <main class="hero-section">
        <div class="hero-wrapper container">
            <div class="right-hero">
                <p class="main-text">This website is awesome</p>
                <p class="secondary-text">
                    This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast
                </p>
                <button class="sign-up button">Sign Up</button>
            </div>
            <div class="left-hero">
                <img src="./images/disenador-2026-small-unsplash.jpg"
                srcset="./images/disenador-2026-medium-unsplash.jpg 2x, ./images/disenador-2026-large-unsplash.jpg 3x"
                 alt="placeholder image" width="200px">
            </div>
        </div>
    </main>
</body>
</html>
